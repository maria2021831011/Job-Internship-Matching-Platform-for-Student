<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CareerLaunch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #7c3aed;
            --accent: #06d6a0;
            --light: #f8fafc;
            --dark: #1e293b;
            --gray: #64748b;
            --light-gray: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 550px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
        }

        .logo-text span {
            color: var(--primary);
        }

        .auth-header h2 {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .auth-header p {
            color: var(--gray);
            font-size: 1rem;
        }

        .tab-navigation {
            display: flex;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--light-gray);
            background: var(--light);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            text-align: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-btn:not(.active):hover {
            background: rgba(37, 99, 235, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .skill-tag {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .skill-tag .remove-skill {
            cursor: pointer;
            font-size: 0.8rem;
        }

        .skill-tag .remove-skill:hover {
            color: var(--primary-dark);
        }

        .file-upload {
            border: 2px dashed var(--light-gray);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
        }

        .file-upload:hover {
            border-color: var(--primary);
        }

        .file-upload i {
            font-size: 2rem;
            color: var(--gray);
            margin-bottom: 10px;
        }

        .file-upload p {
            margin-bottom: 10px;
            color: var(--gray);
        }

        .file-upload .btn {
            display: inline-block;
            width: auto;
            padding: 8px 16px;
        }

        .file-name {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 500;
        }

        .terms {
            margin-bottom: 25px;
        }

        .terms label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--gray);
            cursor: pointer;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-google {
            background: white;
            color: var(--dark);
            border: 2px solid var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-google:hover {
            border-color: var(--gray);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--light-gray);
        }

        .auth-footer p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 30px 25px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .tab-btn {
                padding: 12px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">CL</div>
                    <div class="logo-text">Career<span>Launch</span></div>
                </div>
                <h2>Join CareerLaunch</h2>
                <p>Create your account to get started</p>
            </div>

            <div class="tab-navigation">
                <button type="button" class="tab-btn active" data-tab="student">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button type="button" class="tab-btn" data-tab="company">
                    <i class="fas fa-building"></i> Company
                </button>
            </div>

            <div id="studentForm" class="tab-content active">
                <form id="studentRegisterForm" class="auth-form" action="../api/auth/register_student.php" method="POST" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentName">Full Name</label>
                            <div class="input-with-icon">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="studentName" name="name" placeholder="Enter your full name" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="studentEmail" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentPassword">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="studentPassword" name="password" placeholder="Create a password" required minlength="6">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="studentConfirmPassword">Confirm Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="studentConfirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="institution">Institution</label>
                            <div class="input-with-icon">
                                <i class="fas fa-school input-icon"></i>
                                <input type="text" id="institution" name="institution" placeholder="Your university/college" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="department">Department</label>
                            <div class="input-with-icon">
                                <i class="fas fa-graduation-cap input-icon"></i>
                                <input type="text" id="department" name="department" placeholder="Your field of study">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="skills">Skills</label>
                        <div class="input-with-icon">
                            <i class="fas fa-tools input-icon"></i>
                            <input type="text" id="skills" placeholder="Add skills (e.g., JavaScript, Python, Design)">
                        </div>
                        <div class="skills-container" id="skillsContainer">
                         
                        </div>
                        <input type="hidden" id="skillsData" name="skills">
                    </div>

                    <div class="form-group">
                        <label for="availability">Availability</label>
                        <div class="input-with-icon">
                            <i class="fas fa-calendar input-icon"></i>
                            <select id="availability" name="availability" required>
                                <option value="">Select availability</option>
                                <option value="full_time">Full Time</option>
                                <option value="part_time">Part Time</option>
                                <option value="internship">Internship</option>
                                <option value="flexible">Flexible</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Upload Resume (PDF, max 5MB)</label>
                        <div class="file-upload" id="resumeUpload">
                            <i class="fas fa-file-pdf"></i>
                            <p>Drag & drop your resume or click to browse</p>
                            <button type="button" class="btn btn-outline" style="display: inline-block; width: auto; padding: 8px 16px; background: transparent; color: var(--primary); border: 1px solid var(--primary);">Browse Files</button>
                            <div class="file-name" id="resumeFileName">No file chosen</div>
                        </div>
                        <input type="file" id="resume" name="resume" accept=".pdf" style="display: none;">
                    </div>

                    <div class="terms">
                        <label>
                            <input type="checkbox" name="terms" required>
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Student Account</button>
                </form>
            </div>

            <div id="companyForm" class="tab-content">
                <form id="companyRegisterForm" class="auth-form" action="../api/auth/register_company.php" method="POST">
                    <div class="form-group">
                        <label for="companyName">Company Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="companyName" name="companyName" placeholder="Enter your company name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="companyEmail">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="companyEmail" name="email" placeholder="Enter company email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="companyPassword">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="companyPassword" name="password" placeholder="Create a password" required minlength="6">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="companyConfirmPassword">Confirm Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="companyConfirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="industry">Industry</label>
                            <div class="input-with-icon">
                                <i class="fas fa-industry input-icon"></i>
                                <input type="text" id="industry" name="industry" placeholder="e.g., Technology, Finance" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="website">Website</label>
                            <div class="input-with-icon">
                                <i class="fas fa-globe input-icon"></i>
                                <input type="url" id="website" name="website" placeholder="https://example.com">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Company Description</label>
                        <textarea id="description" name="description" placeholder="Tell us about your company, culture, and what you do..." required></textarea>
                    </div>

                    <div class="terms">
                        <label>
                            <input type="checkbox" name="terms" required>
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Company Account</button>
                </form>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
          
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            function activateTab(tabName) {
             
                tabBtns.forEach(b => b.classList.remove('active'));
                const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
                if (btn) btn.classList.add('active');

              
                tabContents.forEach(content => {
                    content.classList.remove('active');
                    if (content.id === tabName + 'Form') {
                        content.classList.add('active');
                    }
                });
            }

           
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    activateTab(this.dataset.tab);
                });
            });

            
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            if (type === 'company') {
                activateTab('company');
            } else {
                activateTab('student'); 
            }

        
            const skillsInput = document.getElementById('skills');
            const skillsContainer = document.getElementById('skillsContainer');
            const skillsData = document.getElementById('skillsData');
            let skills = [];

            skillsInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ',') {
                    e.preventDefault();
                    const skill = this.value.trim();
                    if (skill && !skills.includes(skill)) {
                        skills.push(skill);
                        updateSkillsDisplay();
                        this.value = '';
                    }
                }
            });

            function updateSkillsDisplay() {
                skillsContainer.innerHTML = '';
                skills.forEach((skill, index) => {
                    const skillTag = document.createElement('div');
                    skillTag.className = 'skill-tag';
                    skillTag.innerHTML = `
                        ${skill} <span class="remove-skill" data-index="${index}">×</span>
                    `;
                    skillsContainer.appendChild(skillTag);
                });
                skillsData.value = skills.join(',');

                document.querySelectorAll('.remove-skill').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        skills.splice(index, 1);
                        updateSkillsDisplay();
                    });
                });
            }

    
            const resumeUpload = document.getElementById('resumeUpload');
            const resumeInput = document.getElementById('resume');
            const resumeFileName = document.getElementById('resumeFileName');

            resumeUpload.addEventListener('click', () => resumeInput.click());

            resumeInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    const file = this.files[0];
                    if (file.type === 'application/pdf') {
                        if (file.size <= 5 * 1024 * 1024) { // 5MB
                            resumeFileName.textContent = file.name;
                            resumeUpload.style.borderColor = 'var(--primary)';
                        } else {
                            alert('File size must be less than 5MB');
                            this.value = '';
                            resumeFileName.textContent = 'No file chosen';
                        }
                    } else {
                        alert('Please upload a PDF file');
                        this.value = '';
                        resumeFileName.textContent = 'No file chosen';
                    }
                }
            });

            resumeUpload.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--primary)';
                this.style.backgroundColor = 'rgba(37, 99, 235, 0.05)';
            });

            resumeUpload.addEventListener('dragleave', function() {
                this.style.borderColor = 'var(--light-gray)';
                this.style.backgroundColor = 'transparent';
            });

            resumeUpload.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--light-gray)';
                this.style.backgroundColor = 'transparent';
                if (e.dataTransfer.files.length > 0) {
                    resumeInput.files = e.dataTransfer.files;
                    resumeInput.dispatchEvent(new Event('change'));
                }
            });

          
            const studentForm = document.getElementById('studentRegisterForm');
            const companyForm = document.getElementById('companyRegisterForm');

            function validateForm(form) {
                const password = form.querySelector('input[name="password"]');
                const confirmPassword = form.querySelector('input[name="confirmPassword"]');

                if (password.value !== confirmPassword.value) {
                    alert('Passwords do not match');
                    return false;
                }

                if (password.value.length < 6) {
                    alert('Password must be at least 6 characters long');
                    return false;
                }

                return true;
            }

            function handleFormSubmit(form, redirectUrl) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    if (!validateForm(this)) return;

                    const submitBtn = this.querySelector('button[type="submit"]');
                    const originalText = submitBtn.textContent;
                    submitBtn.textContent = 'Creating Account...';
                    submitBtn.disabled = true;

                    setTimeout(() => {
                        alert(`${redirectUrl.includes('students') ? 'Student' : 'Company'} account created successfully!`);
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                        window.location.href = redirectUrl;
                    }, 1500);
                });
            }

            handleFormSubmit(studentForm, '../students/dashboard.html');
            handleFormSubmit(companyForm, '../companies/dashboard.html');
        });
    </script>
</body>
</html>
