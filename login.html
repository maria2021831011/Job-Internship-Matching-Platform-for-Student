<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerLaunch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">CL</div>
                    <div class="logo-text">Career<span>Launch</span></div>
                </div>
                <h2>Welcome Back</h2>
                <br>
                <p>Sign in to your account to continue</p>
            </div>

     
            <div class="user-type-selector">
                <button type="button" class="type-option active" data-type="student">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button type="button" class="type-option" data-type="company">
                    <i class="fas fa-building"></i> Company
                </button>
            </div>

       
            <form id="loginForm" class="auth-form" action="../api/auth/login.php" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>

              

    
            <div class="social-login">
                <div class="divider">
                    <span>Or continue with</span>
                </div>
                <button type="button" class="btn btn-google">
                    <i class="fab fa-google"></i> Google
                </button>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one here</a></p>
            </div>
        </div>
    </div>

    <script src="../js/pages/login.js"></script>
</body>
</html>
