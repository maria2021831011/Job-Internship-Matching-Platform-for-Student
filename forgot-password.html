<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CareerLaunch</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      font-size: 2rem;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
    }

    .back-link {
      text-align: center;
      margin-bottom: 20px;
    }

    .back-link a {
      color: #1a2980;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #777;
    }

    input, select {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #1a2980;
      box-shadow: 0 0 0 2px rgba(26, 41, 128, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(26, 41, 128, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 41, 128, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e7f7ef;
      color: #0a7c42;
      border: 1px solid #a3e9c4;
    }

    .error {
      background: #fde8e8;
      color: #c53030;
      border: 1px solid #fbb6b6;
    }

    .info-box {
      background: #e8f4fd;
      border: 1px solid #b3d9f7;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-box p {
      color: #1a5f9e;
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h2>CareerLaunch</h2>
      <p>Reset Your Password</p>
    </div>

    <div class="back-link">
      <a href="login.html">
        <i class="fas fa-arrow-left"></i>
        Back to Login
      </a>
    </div>

    <div id="message" class="message"></div>

    <div class="info-box">
      <p>Enter your email address and we'll send you instructions to reset your password.</p>
    </div>

    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="userType">I am a</label>
        <select id="userType" name="userType" required>
          <option value="">Select user type</option>
          <option value="student">Student</option>
          <option value="company">Company</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Send Reset Instructions</button>
    </form>

    <div style="text-align: center; font-size: 14px; color: #666;">
      Remember your password? <a href="login.html" style="color: #1a2980; text-decoration: none; font-weight: 500;">Login here</a>
    </div>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const userType = document.getElementById('userType').value;
      const messageEl = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.textContent;
      

      if (!userType) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Please select user type';
        return;
      }
      
      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;
      
      fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, userType: userType })
      })
      .then(response => response.json())
      .then(data => {
        messageEl.style.display = 'block';
        
        if (data.success) {
          messageEl.className = 'message success';
          messageEl.textContent = data.message + ' Check your email for reset instructions.';
          
    
          document.getElementById('forgotPasswordForm').reset();
          
     
          if (data.token) {
            setTimeout(() => {
              const demoInfo = `Demo: Use this token to reset - ${data.token}`;
              const demoEl = document.createElement('div');
              demoEl.className = 'message success';
              demoEl.style.marginTop = '10px';
              demoEl.textContent = demoInfo;
              messageEl.parentNode.insertBefore(demoEl, messageEl.nextSibling);
              

              const resetLink = document.createElement('a');
              resetLink.href = `reset-password.html?token=${data.token}`;
              resetLink.textContent = 'Click here to reset password';
              resetLink.style.display = 'block';
              resetLink.style.marginTop = '10px';
              resetLink.style.color = '#1a2980';
              resetLink.style.fontWeight = '500';
              resetLink.style.textDecoration = 'none';
              demoEl.appendChild(resetLink);
            }, 1000);
          }
          
        } else {
          messageEl.className = 'message error';
          messageEl.textContent = data.message;
        }
      })
      .catch(error => {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Error sending reset link. Please try again.';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      });
    });

    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    const userTypeParam = urlParams.get('userType');
    
    if (emailParam) {
      document.getElementById('email').value = emailParam;
    }
    if (userTypeParam) {
      document.getElementById('userType').value = userTypeParam;
    }
  </script>
</body>
</html>
