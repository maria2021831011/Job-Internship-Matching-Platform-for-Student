<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CareerLaunch</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      font-size: 2rem;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      color: #1a2980;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .back-link i {
      margin-right: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #777;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #1a2980;
      box-shadow: 0 0 0 2px rgba(26, 41, 128, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 10px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(26, 41, 128, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 41, 128, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn.secondary {
      background: linear-gradient(to right, #6c757d, #868e96);
      margin-top: 10px;
    }

    .submit-btn.secondary:hover {
      background: linear-gradient(to right, #5a6268, #727b84);
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e7f7ef;
      color: #0a7c42;
      border: 1px solid #a3e9c4;
    }

    .error {
      background: #fde8e8;
      color: #c53030;
      border: 1px solid #fbb6b6;
    }

    .info {
      background: #e8f4fd;
      color: #1a56db;
      border: 1px solid #a3c9e9;
    }

    .steps {
      margin-top: 30px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .steps h3 {
      color: #1a2980;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .steps ol {
      padding-left: 20px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .steps li {
      margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="login.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>

    <div class="logo">
      <h2>CareerLaunch</h2>
      <p>Reset your password</p>
    </div>

    <div id="message" class="message"></div>

    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Send Reset Link
      </button>

      <button type="button" class="submit-btn secondary" id="resendBtn">
        Resend Reset Link
      </button>
    </form>

    <div class="steps">
      <h3>How it works:</h3>
      <ol>
        <li>Enter your registered email address</li>
        <li>Check your email for a password reset link</li>
        <li>Click the link to create a new password</li>
        <li>Login with your new password</li>
      </ol>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('forgotPasswordForm');
      const messageEl = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const resendBtn = document.getElementById('resendBtn');
      
      let resendCount = 0;
      const MAX_RESEND_ATTEMPTS = 3;

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        
        if (!validateEmail(email)) {
          showMessage('Please enter a valid email address', 'error');
          return;
        }

        await sendResetLink(email);
      });

      resendBtn.addEventListener('click', async function() {
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
          showMessage('Please enter your email address first', 'error');
          return;
        }

        if (!validateEmail(email)) {
          showMessage('Please enter a valid email address', 'error');
          return;
        }

        resendCount++;
        
        if (resendCount > MAX_RESEND_ATTEMPTS) {
          showMessage('Too many resend attempts. Please wait a few minutes before trying again.', 'error');
          return;
        }

        await resendResetLink(email);
      });

      function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      async function sendResetLink(email) {
        const originalText = submitBtn.textContent;
        
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email }),
          });

          const data = await response.json();

          if (data.success) {
            showMessage(data.message || 'Password reset link sent to your email!', 'success');
          } else {
            showMessage(data.message || 'Failed to send reset link. Please try again.', 'error');
          }

        } catch (error) {
          console.error('Error sending reset link:', error);
          showMessage('Network error. Please check your connection and try again.', 'error');
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      }

      async function resendResetLink(email) {
        const originalText = resendBtn.textContent;
        
        resendBtn.textContent = 'Sending...';
        resendBtn.disabled = true;

        try {
          const response = await fetch('/api/auth/resend-reset-link', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email }),
          });

          const data = await response.json();

          if (data.success) {
            showMessage(data.message || 'New reset link sent!', 'success');
          } else {
            showMessage(data.message || 'Failed to send new link. Please try again.', 'error');
          }

        } catch (error) {
          console.error('Error resending reset link:', error);
          showMessage('Network error. Please check your connection and try again.', 'error');
        } finally {
          resendBtn.textContent = 'Resend Reset Link';
          resendBtn.disabled = false;
        }
      }

      function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = `message ${type}`;
        messageEl.style.display = 'block';

        if (type === 'success') {
          setTimeout(() => {
            messageEl.style.display = 'none';
          }, 5000);
        }
      }
    });
  </script>
</body>
</html>
