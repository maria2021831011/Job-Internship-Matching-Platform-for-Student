<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password - CareerLaunch</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      font-size: 2rem;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #777;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #1a2980;
      box-shadow: 0 0 0 2px rgba(26, 41, 128, 0.1);
    }

    .password-strength {
      margin-top: 5px;
      font-size: 12px;
      height: 15px;
    }

    .strength-weak { color: #e53e3e; }
    .strength-medium { color: #dd6b20; }
    .strength-strong { color: #38a169; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(26, 41, 128, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 41, 128, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e7f7ef;
      color: #0a7c42;
      border: 1px solid #a3e9c4;
    }

    .error {
      background: #fde8e8;
      color: #c53030;
      border: 1px solid #fbb6b6;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #1a2980;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h2>CareerLaunch</h2>
      <p>Create new password</p>
    </div>

    <div id="message" class="message"></div>

    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6">
        </div>
        <div id="passwordStrength" class="password-strength"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Reset Password
      </button>
    </form>

    <div class="login-link">
      Remember your password? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('resetPasswordForm');
      const messageEl = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordStrengthEl = document.getElementById('passwordStrength');

 
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const email = urlParams.get('email');


      if (!token || !email) {
        showMessage('Invalid or expired reset link. Please request a new one.', 'error');
        form.style.display = 'none';
        return;
      }

      newPasswordInput.addEventListener('input', function() {
        const password = this.value;
        const strength = checkPasswordStrength(password);
        passwordStrengthEl.textContent = strength.message;
        passwordStrengthEl.className = `password-strength strength-${strength.level}`;
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!validatePasswords(newPassword, confirmPassword)) {
          return;
        }

        await resetPassword(email, token, newPassword);
      });

      function checkPasswordStrength(password) {
        if (password.length === 0) {
          return { level: '', message: '' };
        }
        
        if (password.length < 6) {
          return { level: 'weak', message: 'Too short (min 6 characters)' };
        }

        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumbers = /\d/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        let score = 0;
        if (hasUpperCase) score++;
        if (hasLowerCase) score++;
        if (hasNumbers) score++;
        if (hasSpecialChar) score++;
        if (password.length >= 8) score++;

        if (score <= 2) return { level: 'weak', message: 'Weak password' };
        if (score <= 4) return { level: 'medium', message: 'Medium strength' };
        return { level: 'strong', message: 'Strong password' };
      }

      function validatePasswords(newPassword, confirmPassword) {
        if (newPassword.length < 6) {
          showMessage('Password must be at least 6 characters long', 'error');
          return false;
        }

        if (newPassword !== confirmPassword) {
          showMessage('Passwords do not match', 'error');
          return false;
        }

        return true;
      }

      async function resetPassword(email, token, newPassword) {
        const originalText = submitBtn.textContent;
        
        submitBtn.textContent = 'Resetting...';
        submitBtn.disabled = true;

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 
              email: email,
              token: token,
              newPassword: newPassword 
            }),
          });

          const data = await response.json();

          if (data.success) {
            showMessage(data.message || 'Password reset successfully! Redirecting to login...', 'success');
            form.reset();
            
        
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 3000);
          } else {
            showMessage(data.message || 'Failed to reset password. Please try again.', 'error');
          }

        } catch (error) {
          console.error('Error resetting password:', error);
          showMessage('Network error. Please check your connection and try again.', 'error');
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      }

      function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = `message ${type}`;
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
