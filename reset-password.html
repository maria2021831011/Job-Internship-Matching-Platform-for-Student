<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CareerLaunch</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      font-size: 2rem;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
    }

    .back-link {
      text-align: center;
      margin-bottom: 20px;
    }

    .back-link a {
      color: #1a2980;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #777;
    }

    input, select {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #1a2980;
      box-shadow: 0 0 0 2px rgba(26, 41, 128, 0.1);
    }

    .password-strength {
      margin-top: 5px;
      font-size: 12px;
    }

    .strength-weak { color: #e53e3e; }
    .strength-medium { color: #dd6b20; }
    .strength-strong { color: #38a169; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #1a2980, #26d0ce);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(26, 41, 128, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 41, 128, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e7f7ef;
      color: #0a7c42;
      border: 1px solid #a3e9c4;
    }

    .error {
      background: #fde8e8;
      color: #c53030;
      border: 1px solid #fbb6b6;
    }

    .warning {
      background: #fef5e7;
      color: #dd6b20;
      border: 1px solid #fbd38d;
    }

    .info-box {
      background: #e8f4fd;
      border: 1px solid #b3d9f7;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-box p {
      color: #1a5f9e;
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h2>CareerLaunch</h2>
      <p>Create New Password</p>
    </div>

    <div class="back-link">
      <a href="login.html">
        <i class="fas fa-arrow-left"></i>
        Back to Login
      </a>
    </div>

    <div id="message" class="message"></div>

    <div class="info-box">
      <p>Your new password must be different from previously used passwords.</p>
    </div>

    <form id="resetPasswordForm">
      <input type="hidden" id="resetToken" name="token">
      
      <div class="form-group">
        <label for="userType">I am a</label>
        <select id="userType" name="userType" required>
          <option value="">Select user type</option>
          <option value="student">Student</option>
          <option value="company">Company</option>
        </select>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="newPassword" name="password" placeholder="Enter new password" required minlength="6">
        </div>
        <div id="passwordStrength" class="password-strength"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required minlength="6">
        </div>
        <div id="passwordMatch" class="password-strength"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>
    </form>

    <div style="text-align: center; font-size: 14px; color: #666;">
      Remember your password? <a href="login.html" style="color: #1a2980; text-decoration: none; font-weight: 500;">Login here</a>
    </div>
  </div>

  <script>

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (token) {
      document.getElementById('resetToken').value = token;
    } else {
      document.getElementById('message').style.display = 'block';
      document.getElementById('message').className = 'message error';
      document.getElementById('message').textContent = 'Invalid or missing reset token. Please request a new reset link.';
      document.getElementById('submitBtn').disabled = true;
    }


    document.getElementById('newPassword').addEventListener('input', function() {
      const password = this.value;
      const strengthEl = document.getElementById('passwordStrength');
      
      if (password.length === 0) {
        strengthEl.textContent = '';
        return;
      }
      
      let strength = 'Weak';
      let strengthClass = 'strength-weak';
      
      if (password.length >= 8) {
        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumbers = /\d/.test(password);
        const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        
        const requirements = [hasUpperCase, hasLowerCase, hasNumbers, hasSpecial].filter(Boolean).length;
        
        if (requirements >= 3) {
          strength = 'Strong';
          strengthClass = 'strength-strong';
        } else if (requirements >= 2) {
          strength = 'Medium';
          strengthClass = 'strength-medium';
        }
      }
      
      strengthEl.textContent = `Password strength: ${strength}`;
      strengthEl.className = `password-strength ${strengthClass}`;
    });


    document.getElementById('confirmPassword').addEventListener('input', function() {
      const password = document.getElementById('newPassword').value;
      const confirmPassword = this.value;
      const matchEl = document.getElementById('passwordMatch');
      
      if (confirmPassword.length === 0) {
        matchEl.textContent = '';
        return;
      }
      
      if (password === confirmPassword) {
        matchEl.textContent = 'Passwords match';
        matchEl.className = 'password-strength strength-strong';
      } else {
        matchEl.textContent = 'Passwords do not match';
        matchEl.className = 'password-strength strength-weak';
      }
    });


    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const token = document.getElementById('resetToken').value;
      const userType = document.getElementById('userType').value;
      const messageEl = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.textContent;
      
     
      if (!userType) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Please select user type';
        return;
      }
      
    
      if (password !== confirmPassword) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Passwords do not match!';
        return;
      }
    
      if (password.length < 6) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Password must be at least 6 characters long';
        return;
      }
      
      submitBtn.textContent = 'Resetting...';
      submitBtn.disabled = true;
      
      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          token: token, 
          password: password,
          userType: userType 
        })
      })
      .then(response => response.json())
      .then(data => {
        messageEl.style.display = 'block';
        
        if (data.success) {
          messageEl.className = 'message success';
          messageEl.textContent = data.message;
          
          document.getElementById('resetPasswordForm').reset();
          document.getElementById('passwordStrength').textContent = '';
          document.getElementById('passwordMatch').textContent = '';
          
     
          setTimeout(() => {
            window.location.href = 'login.html?message=password_reset_success';
          }, 3000);
          
        } else {
          messageEl.className = 'message error';
          messageEl.textContent = data.message;
        }
      })
      .catch(error => {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Error resetting password. Please try again.';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      });
    });

  
    const userTypeParam = urlParams.get('userType');
    if (userTypeParam) {
      document.getElementById('userType').value = userTypeParam;
    }
  </script>
</body>
</html>
