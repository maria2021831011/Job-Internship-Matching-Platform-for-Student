<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladeshi IT Companies - CareerLaunch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --success: #06d6a0;
            --warning: #ff9e00;
            --danger: #ef476f;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --gradient-primary: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            --border-radius: 16px;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .header p {
            color: var(--gray);
            font-size: 1.1rem;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .company-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        .company-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .company-number {
            background: var(--gradient-primary);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .company-website {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--gray);
        }

        .website-link {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
            transition: all 0.3s ease;
        }

        .website-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .company-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .companies-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>

        <div class="header">
            <h1>বাংলাদেশের ২৫+ Software / IT Company</h1>
            <p>Official Website Links for Internship & Job Opportunities</p>
        </div>

        <div class="companies-grid" id="companiesList">
          
        </div>
    </div>

    <script>
        
        const companies = [
            {
                name: "Brain Station 23",
                website: "https://brainstation-23.com/",
                description: "Leading software company with international clients"
            },
            {
                name: "TigerIT Bangladesh",
                website: "https://www.tigerit.com/",
                description: "Specialized in identity management solutions"
            },
            {
                name: "Pathao Ltd.",
                website: "https://pathao.com/",
                description: "Ride-sharing and delivery service platform"
            },
            {
                name: "Cefalo Bangladesh",
                website: "https://www.cefalo.com/en/",
                description: "Software development for Scandinavian market"
            },
            {
                name: "Orbitax",
                website: "https://orbitax.com/",
                description: "Global tax solutions and software"
            },
            {
                name: "DSI – Dynamic Solution Innovators",
                website: "https://www.dsinnovators.com/",
                description: "Enterprise software solutions"
            },
            {
                name: "Vivasoft Ltd.",
                website: "https://vivasoftltd.com/",
                description: "Custom software development"
            },
            {
                name: "Datasoft Systems Bangladesh",
                website: "https://datasoft-bd.com/",
                description: "IT services and solutions"
            },
            {
                name: "Southtech Group",
                website: "https://www.southtechgroup.com/",
                description: "Financial software solutions"
            },
            {
                name: "BJIT Ltd.",
                website: "https://www.bjitgroup.com/",
                description: "Japanese IT company in Bangladesh"
            },
            {
                name: "Kaz Software",
                website: "https://kaz.com.bd/",
                description: "Software development services"
            },
            {
                name: "Nascenia",
                website: "https://nascenia.com/",
                description: "Web and mobile application development"
            },
            {
                name: "Riseup Labs",
                website: "https://riseuplabs.com/",
                description: "Game and app development studio"
            },
            {
                name: "Dream71 Bangladesh Ltd.",
                website: "https://dream71.com/",
                description: "AI and robotics solutions"
            },
            {
                name: "Ollyo",
                website: "https://ollyo.com/",
                description: "Web development and digital solutions"
            },
            {
                name: "weDevs",
                website: "https://wedevs.com/",
                description: "WordPress plugin development"
            },
            {
                name: "Therap (BD) Ltd.",
                website: "https://therapbd.com/",
                description: "Healthcare software solutions"
            },
            {
                name: "REVE Systems",
                website: "https://revesoft.com/",
                description: "VoIP and communication solutions"
            },
            {
                name: "Mediasoft Data Systems Ltd.",
                website: "https://mediasoftbd.com/",
                description: "Software and digital solutions"
            },
            {
                name: "Bdtask Ltd.",
                website: "https://bdtask.com/",
                description: "Software development company"
            },
            {
                name: "Skylark Soft Ltd.",
                website: "https://skylarksoft.com/",
                description: "IT services and consulting"
            },
            {
                name: "WellDev Bangladesh",
                website: "https://welldev.com.bd/",
                description: "Software development services"
            },
            {
                name: "InfoLink Limited",
                website: "https://infolinkbd.com/",
                description: "IT solutions and services"
            },
            {
                name: "Brain Craft Ltd.",
                website: "https://brain-craft.com/",
                description: "Software development company"
            },
            {
                name: "EBS – Era Infotech Ltd.",
                website: "https://erainfotech.com/",
                description: "IT solutions and services"
            }
        ];

       
        function loadCompanies() {
            const container = document.getElementById('companiesList');
            
            container.innerHTML = companies.map((company, index) => `
                <div class="company-card">
                    <div class="company-number">${index + 1}</div>
                    <div class="company-name">${company.name}</div>
                    <div class="company-website">
                        <i class="fas fa-globe"></i>
                        <a href="${company.website}" target="_blank" class="website-link">
                            ${company.website.replace('https://', '').replace('www.', '')}
                        </a>
                    </div>
                    <p style="color: var(--gray); margin-bottom: 15px; font-size: 0.95rem;">
                        ${company.description}
                    </p>
                    <div class="company-actions">
                        <a href="${company.website}" target="_blank" class="btn btn-primary">
                            <i class="fas fa-external-link-alt"></i> Visit Website
                        </a>
                        <button class="btn btn-outline save-company-btn" data-company='${JSON.stringify(company).replace(/'/g, "&apos;")}'>
                            <i class="fas fa-bookmark"></i> Save
                        </button>
                    </div>
                </div>
            `).join('');

            
            document.querySelectorAll('.save-company-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const companyData = JSON.parse(this.getAttribute('data-company').replace(/&apos;/g, "'"));
                    saveCompany(companyData);
                });
            });
        }

        
        function saveCompany(company) {
            let savedCompanies = JSON.parse(localStorage.getItem('savedCompanies') || '[]');
            
            const exists = savedCompanies.some(saved => saved.website === company.website);
            
            if (!exists) {
                savedCompanies.push(company);
                localStorage.setItem('savedCompanies', JSON.stringify(savedCompanies));
                showNotification(`Saved ${company.name} to your companies list!`, 'success');
            } else {
                showNotification(`${company.name} is already in your saved list!`, 'info');
            }
        }

        
        function showNotification(message, type) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                z-index: 1000;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                background: ${type === 'success' ? '#06d6a0' : '#4361ee'};
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        
        document.addEventListener('DOMContentLoaded', loadCompanies);
    </script>
</body>
</html>
