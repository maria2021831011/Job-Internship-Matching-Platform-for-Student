<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Jobs - CareerLaunch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --success: #06d6a0;
            --warning: #ff9e00;
            --danger: #ef476f;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
            --gradient-primary: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            --gradient-success: linear-gradient(135deg, #06d6a0 0%, #04a777 100%);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

    
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--gradient-primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
        }

        .logo-text span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 12px 15px 12px 45px;
            border: 1px solid var(--light-gray);
            border-radius: 12px;
            width: 300px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.8);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
            background: white;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .user-profile:hover {
            background: rgba(67, 97, 238, 0.05);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }

    
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
            border-left: 5px solid var(--primary);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            background: var(--gradient-primary);
        }

        .stat-info h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .stat-info p {
            color: var(--gray);
            font-size: 0.9rem;
        }

    
        .jobs-section {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(248, 249, 250, 0.5);
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: var(--dark);
            font-weight: 700;
            position: relative;
            padding-left: 15px;
        }

        .section-header h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 25px;
            border-radius: 10px;
            background: var(--gradient-primary);
        }

        .section-actions {
            display: flex;
            gap: 15px;
        }

        .section-content {
            padding: 30px;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .job-card {
            border: 1px solid var(--light-gray);
            border-radius: 14px;
            padding: 25px;
            transition: var(--transition);
            background: white;
            position: relative;
            overflow: hidden;
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-primary);
        }

        .job-card.new {
            animation: pulse 2s infinite;
            border: 2px solid var(--primary);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(67, 97, 238, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(67, 97, 238, 0); }
            100% { box-shadow: 0 0 0 0 rgba(67, 97, 238, 0); }
        }

        .job-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .job-info h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .job-info .company {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .job-type {
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .job-match {
            background: var(--gradient-success);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .job-details span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .job-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .skill-tag {
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .job-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--gradient-primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(67, 97, 238, 0.1);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-success:hover {
            background: var(--gradient-success);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(6, 214, 160, 0.3);
        }

    
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.info {
            background: var(--primary);
        }

        .toast i {
            font-size: 1.2rem;
        }

    
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--dark);
        }

        .filter-select {
            padding: 10px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        
        .real-time-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--success);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 18px;
                align-items: flex-start;
            }
            
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .search-box input {
                width: 200px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .search-box input {
                width: 180px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
    
        <div class="header">
            <div class="logo">
                <div class="logo-icon">CL</div>
                <div class="logo-text">Career<span>Launch</span></div>
            </div>
            
            <div class="header-actions">
                <div class="real-time-indicator">
                    <div class="pulse-dot"></div>
                    <span>Live Jobs</span>
                </div>
                
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search jobs, companies...">
                </div>
                
                <div class="user-profile">
                    <div class="avatar">SJ</div>
                    <div>
                        <div style="font-weight: 600;">Sarah Johnson</div>
                        <div style="font-size: 0.85rem; color: var(--gray);">Computer Science</div>
                    </div>
                </div>
            </div>
        </div>

    
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-briefcase"></i>
                </div>
                <div class="stat-info">
                    <h3 id="total-jobs">24</h3>
                    <p>Available Jobs</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="stat-info">
                    <h3 id="new-today">3</h3>
                    <p>New Today</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="stat-info">
                    <h3 id="remote-jobs">12</h3>
                    <p>Remote Positions</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="stat-info">
                    <h3 id="companies">18</h3>
                    <p>Hiring Companies</p>
                </div>
            </div>
        </div>

        
        <div class="filters">
            <div class="filter-group">
                <label for="job-type">Job Type</label>
                <select id="job-type" class="filter-select">
                    <option value="all">All Types</option>
                    <option value="internship">Internship</option>
                    <option value="full-time">Full-time</option>
                    <option value="part-time">Part-time</option>
                    <option value="contract">Contract</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="location">Location</label>
                <select id="location" class="filter-select">
                    <option value="all">All Locations</option>
                    <option value="remote">Remote</option>
                    <option value="new-york">New York</option>
                    <option value="san-francisco">San Francisco</option>
                    <option value="boston">Boston</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="skills">Skills</label>
                <select id="skills" class="filter-select">
                    <option value="all">All Skills</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="react">React</option>
                    <option value="node">Node.js</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="sort">Sort By</label>
                <select id="sort" class="filter-select">
                    <option value="newest">Newest First</option>
                    <option value="relevance">Relevance</option>
                    <option value="deadline">Application Deadline</option>
                </select>
            </div>
        </div>

       
        <div class="jobs-section">
            <div class="section-header">
                <h2>Available Job Opportunities</h2>
                <div class="section-actions">
                    <button class="btn btn-outline" id="refreshJobs">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
            
            <div class="section-content">
                <div class="jobs-grid" id="jobsGrid">
                   
                </div>
            </div>
        </div>
    </div>

    <script>
       
        let allJobs = [];
        let socket = null;
        let newJobsCount = 0;

        
        document.addEventListener('DOMContentLoaded', function() {
            
            loadJobs();
            
            setupEventListeners();
            
            connectToRealTime();
        });

       
        function setupEventListeners() {
        
            document.getElementById('searchInput').addEventListener('input', function() {
                const query = this.value.toLowerCase();
                if (query.length > 2) {
                    filterJobs(query);
                } else {
                    renderJobs(allJobs);
                }
            });

         
            document.getElementById('job-type').addEventListener('change', applyFilters);
            document.getElementById('location').addEventListener('change', applyFilters);
            document.getElementById('skills').addEventListener('change', applyFilters);
            document.getElementById('sort').addEventListener('change', applyFilters);

           
            document.getElementById('refreshJobs').addEventListener('click', function() {
                loadJobs();
                showNotification('Jobs refreshed!', 'success');
            });
        }

        async function loadJobs() {
            try {
              
                const response = await fetch('/api/jobs/active');
                const result = await response.json();
                
                if (result.success) {
                    allJobs = result.jobs;
                    renderJobs(allJobs);
                    updateStats();
                } else {
                    console.error('Failed to load jobs');
                 
                    loadMockJobs();
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
             
                loadMockJobs();
            }
        }

      
        function renderJobs(jobs) {
            const container = document.getElementById('jobsGrid');
            
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <i class="fas fa-briefcase" style="font-size: 3rem; color: var(--gray); margin-bottom: 15px;"></i>
                        <h3>No jobs available right now</h3>
                        <p>Check back later for new opportunities</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card ${job.isNew ? 'new' : ''}" data-job-id="${job.id}">
                    <div class="job-header">
                        <div class="job-info">
                            <h3>${job.title}</h3>
                            <p class="company">${job.companyName}</p>
                            <span class="job-type">${job.job_type}</span>
                        </div>
                        <div class="job-match">
                            <i class="fas fa-bolt"></i> ${calculateMatchScore(job)}% Match
                        </div>
                    </div>
                    
                    <div class="job-details">
                        <span><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
                        <span><i class="fas fa-clock"></i> ${job.job_type}</span>
                        <span><i class="fas fa-money-bill-wave"></i> ${job.salary_range}</span>
                    </div>
                    
                    <div class="job-details">
                        <span><i class="fas fa-calendar"></i> Posted: ${formatDate(job.postedAt)}</span>
                        <span><i class="fas fa-hourglass-end"></i> Deadline: ${formatDate(job.deadline)}</span>
                    </div>
                    
                    <div class="job-skills">
                        ${job.skills_required ? job.skills_required.split(',').map(skill => 
                            `<span class="skill-tag">${skill.trim()}</span>`
                        ).join('') : ''}
                    </div>
                    
                    <div class="job-actions">
                        <button class="btn btn-primary apply-job-btn" data-job-id="${job.id}">
                            <i class="fas fa-paper-plane"></i> Apply Now
                        </button>
                        <button class="btn btn-outline save-job-btn" data-job-id="${job.id}">
                            <i class="fas fa-bookmark"></i> Save
                        </button>
                    </div>
                </div>
            `).join('');
            
        
            container.querySelectorAll('.apply-job-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const jobId = this.getAttribute('data-job-id');
                    applyForJob(jobId);
                });
            });
            
            container.querySelectorAll('.save-job-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const jobId = this.getAttribute('data-job-id');
                    saveJob(jobId);
                });
            });

            
            setTimeout(() => {
                container.querySelectorAll('.job-card.new').forEach(card => {
                    card.classList.remove('new');
                });
            }, 5000);
        }

        
        async function applyForJob(jobId) {
            const job = allJobs.find(j => j.id == jobId);
            if (!job) return;
            
            if (!confirm(`Apply for ${job.title} at ${job.companyName}?`)) {
                return;
            }

            try {
                const response = await fetch('/api/jobs/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        jobId: jobId,
                        coverLetter: 'I am very interested in this position and believe my skills are a great match.'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(`Application submitted for ${job.title}!`, 'success');
                    
                
                    const applyBtn = document.querySelector(`[data-job-id="${jobId}"] .apply-job-btn`);
                    if (applyBtn) {
                        applyBtn.innerHTML = '<i class="fas fa-check"></i> Applied';
                        applyBtn.classList.remove('btn-primary');
                        applyBtn.classList.add('btn-success');
                        applyBtn.disabled = true;
                    }
                } else {
                    showNotification(result.message || 'Error applying for job', 'error');
                }
            } catch (error) {
                console.error('Error applying for job:', error);
                showNotification('Error applying for job. Please try again.', 'error');
            }
        }

        
        async function saveJob(jobId) {
            try {
                const response = await fetch('/api/jobs/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ jobId: jobId })
                });
                
                if (response.ok) {
                    showNotification('Job saved to your list!', 'success');
                    
                    
                    const saveBtn = document.querySelector(`[data-job-id="${jobId}"] .save-job-btn`);
                    if (saveBtn) {
                        saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved';
                        saveBtn.disabled = true;
                    }
                } else {
                    showNotification('Error saving job. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error saving job:', error);
                showNotification('Error saving job. Please try again.', 'error');
            }
        }

    
        function filterJobs(query) {
            const filteredJobs = allJobs.filter(job => 
                job.title.toLowerCase().includes(query) || 
                job.companyName.toLowerCase().includes(query) ||
                (job.skills_required && job.skills_required.toLowerCase().includes(query)) ||
                job.location.toLowerCase().includes(query)
            );
            
            renderJobs(filteredJobs);
        }

        
        function applyFilters() {
            const jobType = document.getElementById('job-type').value;
            const location = document.getElementById('location').value;
            const skills = document.getElementById('skills').value;
            const sort = document.getElementById('sort').value;
            
            let filteredJobs = [...allJobs];
        
            if (jobType !== 'all') {
                filteredJobs = filteredJobs.filter(job => job.job_type.toLowerCase() === jobType);
            }
            
        
            if (location !== 'all') {
                if (location === 'remote') {
                    filteredJobs = filteredJobs.filter(job => 
                        job.location.toLowerCase().includes('remote') || 
                        job.location.toLowerCase().includes('anywhere')
                    );
                } else {
                    filteredJobs = filteredJobs.filter(job => 
                        job.location.toLowerCase().includes(location)
                    );
                }
            }
            
        
            if (skills !== 'all') {
                filteredJobs = filteredJobs.filter(job => 
                    job.skills_required && job.skills_required.toLowerCase().includes(skills)
                );
            }
            
            
            if (sort === 'newest') {
                filteredJobs.sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));
            } else if (sort === 'deadline') {
                filteredJobs.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            }
        
            
            renderJobs(filteredJobs);
        }

        
        function updateStats() {
            const totalJobs = allJobs.length;
            const newToday = allJobs.filter(job => {
                const postedDate = new Date(job.postedAt);

                return postedDate.toDateString() === today.toDateString();
            }).length;
            
            const remoteJobs = allJobs.filter(job => 
                job.location.toLowerCase().includes('remote') || 
                job.location.toLowerCase().includes('anywhere')
            ).length;
            
            const companies = [...new Set(allJobs.map(job => job.companyName))].length;
            
            document.getElementById('total-jobs').textContent = totalJobs;
            document.getElementById('new-today').textContent = newToday;
            document.getElementById('remote-jobs').textContent = remoteJobs;
            document.getElementById('companies').textContent = companies;
        }

        function showNotification(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) return 'yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            return date.toLocaleDateString();
        }
